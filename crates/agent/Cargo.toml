[package]
name = "figcraft-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent panel backends: local agent CLIs (Claude Code, OpenCode, Codex) and direct LLM APIs driving a running FigCraft through its MCP tools"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
figcraft-mcp = { workspace = true }

# The HTTP backends: desktop-only, so the web build never sees rustls.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
